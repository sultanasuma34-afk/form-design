<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="heading" class="text-center">Form <span id="heading" style="color: #2B1664;">Design</span></h1>
    <div class="margin-auto">
        <div class="container">
            <h1><span class="green-text">Create</span> <span class="normal-text">Profile</span></h1>
            <form action="/addStudent" target="_blank" method="post">
                <section class="general-information">
                    <h3 class="section-title">General Information</h3>
                    <div class="flex-div">
                        <div class="flex-col-50">
                            <label for="firstname" class="margin-zero">First Name</label>
                            <input type="text" placeholder="Enter First Name" name="firstname" class="input-form"  required>
                                
                        </div>
                        <div class="flex-col-50">
                            <label for="lastname" class='margin-zero'>Last Name</label>
                                <input type="text" placeholder="Enter Last Name" name="lastname" class="input-form"  required />
                        </div>
                    </div>
                    <div class="flex-div">
                        <div class="flex-col-50">
                            <label for="dept">Department</label>
                            <select  name="department" class="input-form-1" id="dept" required>
                                <option value="CSE">CSE</option>
                                <option value="EEE">EEE</option>
                                <option value="ME">ME</option>
                                <option value="CE">CE</option>
                                <option value="ECE">ECE</option>
                                <option value="ETE">ETE</option>
                                <option value="BECM">BECM</option>
                                <option value="URP">URP</option>
                                <option value="CFPE">CFPE</option>
                                <option value="ARCHI">ARCHI</option>
                                <option value="MSE">MSE</option>
                                <option value="MTE">MTE</option>
                                <option value="GCE">GCE</option>
                                <option value="IPE">IPE</option>
                            </select>
                                
                        </div>
                        <div class="flex-col-50">
                                <label for="idno">ID No</label>
                                <input type="text" name="idno" class="input-form" placeholder="Ex-2003008" id="id_no"  required/>
                        </div>
                    </div>
                    <div class="flex-div">
                        <div class="flex-col-50">
                            <label for="session">Session</label>
                            <input type="text" name="session" placeholder="Ex-2020-2021" class="input-form" id="session" required>
                                
                        </div>
                        <div class="flex-col-50">
                            <label for="semester">Semester</label>
                            <select name="semester" class="input-form-1" id="semester" required>
                                <option value="1st year odd semester">1st year odd semester</option>
                                <option value="1st year even semester">1st year even semester</option>
                                <option value="2nd year odd semester">2nd year odd semester</option>
                                <option value="2nd year even semester">2nd year even semester</option>
                                <option value="3rd year odd semester">3rd year odd semester</option>
                                <option value="3rd year even semester">3rd year even semester</option>
                                <option value="4th year odd semester">4th year odd semester</option>
                                <option value="4th year even semester">4th year even semester</option>
                            </select>
                    </div>
                    </div>
                    <div class="flex-div">
                        <div class="flex-col-50">
                            <label for="bloodgroup">Blood Group</label>
                            <input type="text" placeholder="Enter Blood Group" class="input-form" id="bloodgroup" name="bloodgroup" placeholder="Enter Blood Group" required/>   
                        </div>
                        <div class="flex-col-50">
                            <label for="dob">Date of Birth</label>
                            <input type="date" class="input-form" id="dob" name="dob" placeholder="Enter Blood Group" required/>   
                        </div>
                    </div>
                    </section>

                    <section class="contact-information">
                        <h3 class="section-title">Contact Information</h3>
                        
                            <label for="mobileno">Mobile No.</label>
                            <input type="tel" placeholder="Enter Phone No." class="input-form" id="mobileno" name="mobile_no" placeholder="Enter Phone No." required>
                        
                            <label for="email" class='margin-zero'>Email</label>
                            <input type="email" name="email" class="input-form" placeholder="Enter your email" id="mail"  required/>
                            <div id="code">

                            </div>
                           
                            
                    </section>
                    <section class="security-information">
                        <h3 class="section-title">Security Information</h3>
                        <label for="password" class="margin-zero">Password</label>
                        <input type="password" placeholder="Enter strong password" class="input-form" id="password" name="password" required>
                        <!-- <label for="passwordconfirmation" class="margin-zero">Re-enter Password</label>
                        <input type="password" placeholder="Re-enter password" class="input-form" name="passwordconfirmation" id="password_confirmation" required> -->
                    </section>
                    <section class="address-information">
                        <h3 class="section-title">Address Information</h3>
                        <label for="address" class="margin-zero">Permanent Address</label>
                        <input type="address" placeholder="Enter Permanent Address" class="input-form" name="permanentaddress" id="address" required>
                        <label for="present-address" class="margin-zero">Present Address or Hall Name</label>
                        <input type="address" placeholder="Enter Present Address" class="input-form" name="presentaddress" id="present_address" required>
                    </section>
                    <button class="button" type="submit">Create</button>
            
            
            </form> 
            <!-- container -->
        </div>
    </div>
    
    <script src=""></script>
</body>
</html>
